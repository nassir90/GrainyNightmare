<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dusk Wind Farm</title>
<style>
  :root { --night:#0e0e10; --ink:#fff; --ink-faint:rgba(255,255,255,.35);
          --font-label:"Times New Roman", Times, "Liberation Serif", serif; color-scheme:dark; }
  html,body { margin:0; height:100%; background:var(--night); color:var(--ink); overflow:hidden; font-family:var(--font-label); }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  /* a column of line controls in the lower right, no panel */
  .controls { position:fixed; right:20px; bottom:calc(18px + env(safe-area-inset-bottom, 0px));
    display:grid; grid-template-columns:auto clamp(110px,18vw,170px); column-gap:14px; row-gap:4px; align-items:center;
    font-size:15px; text-transform:uppercase; letter-spacing:.04em; text-shadow:0 0 6px rgba(0,0,0,.55); }
  .controls.hidden-ui { display:none; }
  .controls label { justify-self:end; cursor:pointer; white-space:nowrap; }
  .squeeze { display:inline-block; transform:scaleX(.72); transform-origin:right center; }   /* compressed capitals */
  .line { position:relative; height:22px; }
  .line canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .line input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:ew-resize; }
  .line:focus-within { outline:1px solid var(--ink-faint); outline-offset:2px; }
  .scenes { position:fixed; left:20px; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:2px;
    font-size:15px; text-transform:uppercase; letter-spacing:.04em; text-shadow:0 0 6px rgba(0,0,0,.55); }
  .scenes.hidden-ui { display:none; }
  .scenes button { font:inherit; letter-spacing:inherit; text-transform:inherit; text-shadow:inherit; color:var(--ink); background:none; border:0;
    padding:2px 0; text-align:left; cursor:pointer; opacity:.4; transition:opacity .4s; }
  .scenes button[aria-current="true"] { opacity:1; }
  .scenes button:hover { opacity:.75; }
  .scenes .squeeze { transform-origin:left center; }
  .scenes .walk { margin-top:8px; }
  .scenes .walk[aria-pressed="true"] { opacity:1; }
  body.walking canvas#c { cursor:grab; } body.walking.dragging canvas#c { cursor:grabbing; }
  canvas#c { -webkit-user-select:none; user-select:none; }
  body.walking canvas#c { touch-action:none; }          /* touch gestures are only ours while walking (joystick + look-drag); otherwise the browser keeps pull-to-refresh etc. */
  /* touch layout: nothing but the world while walking; a floating joystick bottom-left, drag anywhere else to look */
  body.touch.walking .scenes, body.touch.walking .controls { opacity:0; pointer-events:none; }
  .joy { position:fixed; left:0; top:0; width:0; height:0; pointer-events:none; opacity:0; transition:opacity .4s; }
  body.touch.walking .joy { opacity:1; }
  .joy .base { position:absolute; width:110px; height:110px; margin:-55px 0 0 -55px; border:1px solid rgba(255,255,255,.35); border-radius:50%; box-shadow:0 0 12px rgba(0,0,0,.4); }
  .joy .knob { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(255,255,255,.28); border:1px solid rgba(255,255,255,.6); }
  .joy.idle .base, .joy.idle .knob { opacity:.4; }
  .topbtn { position:fixed; right:calc(16px + env(safe-area-inset-right, 0px)); top:calc(14px + env(safe-area-inset-top, 0px)); font:inherit; font-size:14px; letter-spacing:.06em; text-transform:uppercase;
    color:#fff; background:rgba(14,14,16,.45); border:1px solid rgba(255,255,255,.35); border-radius:2px; padding:6px 10px; cursor:pointer; display:none; text-shadow:0 0 6px rgba(0,0,0,.6); }
  body.touch.walking #exitbtn { display:block; }
  .controls, .scenes { padding-bottom:env(safe-area-inset-bottom, 0px); transition:opacity .7s; }
  /* the HUD wakes on input and fades when idle; while faded it ignores touches, so the first tap just wakes it */
  body.hud-idle .controls, body.hud-idle .scenes { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="controls" id="controls">
  <label for="speed"><span class="squeeze" id="o_speed" data-name="Wind">Wind</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="speed" type="range" min="0" max="25" step="0.1" value="8"></div>
  <label for="dir"><span class="squeeze" id="o_dir" data-name="From">From</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="dir" type="range" min="0" max="360" step="1" value="150"></div>
  <label for="gust"><span class="squeeze" id="o_gust" data-name="Gusts">Gusts</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="gust" type="range" min="0" max="1" step="0.01" value="0.35"></div>
  <label for="sway"><span class="squeeze" id="o_sway" data-name="Grass">Grass</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="sway" type="range" min="0" max="2" step="0.01" value="1"></div>
  <label for="int"><span class="squeeze" id="o_int" data-name="Blink">Blink</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="int" type="range" min="2" max="120" step="1" value="28"></div>
  <label for="bloom"><span class="squeeze" id="o_bloom" data-name="Bloom">Bloom</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="bloom" type="range" min="0" max="2" step="0.01" value="1"></div>
  <label for="grain"><span class="squeeze" id="o_grain" data-name="Grain">Grain</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="grain" type="range" min="0" max="2" step="0.01" value="1"></div>
</div>

<div class="joy idle" id="joy"><div class="base" id="joybase"></div><div class="knob" id="joyknob"></div></div>
<button class="topbtn" id="exitbtn" type="button">Exit</button>

<nav class="scenes" id="scenes">
  <button data-i="0"><span class="squeeze">Windmills</span></button>
  <button data-i="1"><span class="squeeze">Pylons 1</span></button>
  <button data-i="2"><span class="squeeze">Pylons 2</span></button>
  <button data-i="3"><span class="squeeze">Blank</span></button>
  <button class="walk" id="walkbtn" type="button" aria-pressed="false"><span class="squeeze">E · Walk</span></button>
</nav>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// Linear-light pipeline. Sampled sRGB values are converted to linear on the way in
// (rgb() below, and in the shaders), lighting and bloom happen in linear, and the final pass encodes back to sRGB.
THREE.ColorManagement.enabled = true;

/* ------------------------------------------------------------------ *
 *  Sampled reference data (1080x605 source image)
 * ------------------------------------------------------------------ */
const REF_H = 605, REF_W = 1080, HORIZON_Y = 460;
const FOV = 30;
const F_REF = (REF_H / 2) / Math.tan(THREE.MathUtils.degToRad(FOV / 2)); // focal length in ref pixels

// [y px in ref, r, g, b] — mean of the brighter 40% of pixels per row (excludes silhouettes).
// The reference horizon is a ragged edge of grass stubs, not a fade, so the sky simply runs
// down to its darkest haze colour (33,31,50 measured just above the edge) and the ground starts abruptly.
const SKY_STOPS = [
  [0,106,81,91],[120,101,76,88],[240,92,68,86],[300,83,62,82],[360,70,55,78],
  [420,55,48,71],[440,40,37,58],[460,33,31,50],
].map(([y,r,g,b]) => ({ h: HORIZON_Y - y, c: [r,g,b] })).sort((a,b) => a.h - b.h);

// left→right tint measured across the sky (x px, dr, dg, db), relative to x=540
const TINT_RAW = [[0,-6,-12,-11],[180,-2,-1,-2],[360,1,1,0],[540,0,0,0],[720,-15,-7,-7],[900,-30,-8,-10],[1080,-40,-9,-11]];
const TINT = TINT_RAW.map(r => ({ x: r[0], d: [r[1], r[2], r[3]] }));

const GROUND = [14,14,16], TOWER = [16,14,25], HAZE = [24,22,36];
const rgb = a => new THREE.Color().setRGB(a[0]/255, a[1]/255, a[2]/255, THREE.SRGBColorSpace);   // sRGB bytes → linear Color

// Turbines picked off the reference: [screen x px, hub y px]
const TURBINES = [
  [720,50],[505,230],[140,285],[232,320],[617,322],[828,263],[980,240],
  [250,383],[35,405],[640,385],[1070,355],[715,402],[940,395],[800,410],[120,432],[455,418],[380,425],
];
const HUB_H = 80, CAM_H = 1.7, ROTOR_R = 30;
const GRAIN_DIST = 1200;                                            // metres at which grain reaches full strength (sky counts as ≥ this)
const TOP_MARGIN = 45;                                              // ref px of sky kept above the highest blade tip

// Gentle, never-quite-flat terrain. Same function lives in JS (placement) and GLSL (ground + grass).
const terrain = (x, z) => 0.9 * Math.sin(x * 0.011 + 0.7) * Math.cos(z * 0.014 + 1.9)
                        + 0.45 * Math.sin(x * 0.027 - z * 0.021 + 2.2) + 0.25 * Math.sin(x * 0.06 + z * 0.05);
const TERRAIN_GLSL = `
  float terrain(vec2 p){
    return 0.9 * sin(p.x * 0.011 + 0.7) * cos(p.y * 0.014 + 1.9)
         + 0.45 * sin(p.x * 0.027 - p.y * 0.021 + 2.2) + 0.25 * sin(p.x * 0.06 + p.y * 0.05);
  }`;
const CAM_Y = CAM_H + terrain(0, 0);

/* ------------------------------------------------------------------ *
 *  Renderer, camera, targets
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('c');
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;           // phones and tablets: joystick controls, lighter rendering
document.body.classList.toggle('touch', IS_TOUCH);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(rgb(GROUND), 0);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(rgb([17, 15, 26]), 300, 5000);   // haze for 3D objects matches their unlit colour: distance never brightens them
const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 9500);
camera.position.set(0, CAM_Y, 0);

const HF = { type: THREE.HalfFloatType, colorSpace: THREE.LinearSRGBColorSpace };
const rt = new THREE.WebGLRenderTarget(4, 4, { samples: 4, ...HF });

/* ------------------------------------------------------------------ *
 *  State / controls
 * ------------------------------------------------------------------ */
const S = { speed: 8, dir: 150, gust: 0.35, sway: 1, interval: 2, grain: 1, bloom: 1, flashDur: 0.42 };
const bind = (id, key, fmt) => {
  const el = document.getElementById(id), out = document.getElementById('o_' + id);
  let timer;
  const upd = () => {
    S[key] = parseFloat(el.value);
    out.textContent = fmt(S[key]);                                   // show the value while adjusting, then the name again
    clearTimeout(timer); timer = setTimeout(() => { out.textContent = out.dataset.name; }, 900);
  };
  el.addEventListener('input', upd); S[key] = parseFloat(el.value);
};
// Smoothed copies of the controls. Each moves toward its slider with exponential smoothing
// (a first-order low-pass filter): v += (target - v) * (1 - e^(-dt/τ)). Frame-rate independent.
const V = {};
const TAU = { speed: 1.4, dir: 1.0, gust: 0.7, sway: 0.6, grain: 0.35, bloom: 0.35 };   // time constants, seconds
const smoothControls = dt => {
  for (const k in TAU) {
    const a = 1 - Math.exp(-dt / TAU[k]);
    if (V[k] === undefined) V[k] = S[k];
    V[k] += (k === 'dir' ? ((S[k] - V[k] + 540) % 360 - 180) : (S[k] - V[k])) * a;   // direction takes the short way round
  }
  V.dir = (V.dir + 360) % 360;
};
const compass = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(d / 45) % 8];
bind('speed','speed', v => v.toFixed(1) + ' m/s');
bind('dir','dir', v => v + '° ' + compass(v));
bind('gust','gust', v => v.toFixed(2));
bind('sway','sway', v => v.toFixed(2) + '×');
bind('int','interval', v => v.toFixed(0) + ' s each');
bind('bloom','bloom', v => v.toFixed(2) + '×');
bind('grain','grain', v => v.toFixed(2) + '×');
/* HUD: wakes on any input and fades after a few idle seconds (the video-player pattern). Hovering it or dragging a slider keeps it awake.
   On touch a tap on the scene wakes it; on desktop moving the mouse does. Walking: only a mouse hover wakes it, so look-drags and WASD don't. H pins it hidden. */
{
  const hud = [document.getElementById('controls'), document.getElementById('scenes')], IDLE_MS = IS_TOUCH ? 5000 : 3500;
  let timer = 0, hot = 0, busy = false;
  const sleep = () => { if (!hot && !busy) document.body.classList.add('hud-idle'); };
  const wake = () => { document.body.classList.remove('hud-idle'); clearTimeout(timer); timer = setTimeout(sleep, IDLE_MS); };
  const walking = () => typeof walk !== 'undefined' && walk.on;
  hud.forEach(e => {
    e.addEventListener('pointerenter', () => { hot++; wake(); });
    e.addEventListener('pointerleave', () => { hot = Math.max(0, hot - 1); wake(); });
    e.addEventListener('pointerdown', () => { busy = true; wake(); });
  });
  const release = () => { if (busy) { busy = false; wake(); } };
  addEventListener('pointerup', release); addEventListener('pointercancel', release);
  addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && e.buttons === 0) wake(); });
  addEventListener('pointerdown', () => { if (!walking()) wake(); }, true);
  addEventListener('keydown', () => { if (!walking()) wake(); });
  addEventListener('hudwake', wake);
  wake();
}
addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') [document.getElementById('controls'), document.getElementById('scenes')].forEach(e => e.classList.toggle('hidden-ui')); });

/* ------------------------------------------------------------------ *
 *  Sky dome: sampled gradient down to the horizon + horizontal tint
 * ------------------------------------------------------------------ */
const GRAD_N = 512, GRAD_MIN = 0, GRAD_MAX = HORIZON_Y;
const gradData = new Uint8Array(GRAD_N * 4);
for (let i = 0; i < GRAD_N; i++) {
  const h = GRAD_MIN + (i / (GRAD_N - 1)) * (GRAD_MAX - GRAD_MIN);
  let c;
  if (h <= SKY_STOPS[0].h) c = SKY_STOPS[0].c;
  else if (h >= SKY_STOPS.at(-1).h) c = SKY_STOPS.at(-1).c;
  else {
    let k = 0; while (SKY_STOPS[k + 1].h < h) k++;
    const a = SKY_STOPS[k], b = SKY_STOPS[k + 1], t = (h - a.h) / (b.h - a.h);
    c = a.c.map((v, j) => v + (b.c[j] - v) * t);
  }
  gradData.set([c[0], c[1], c[2], 255], i * 4);
}
const gradTex = new THREE.DataTexture(gradData, GRAD_N, 1, THREE.RGBAFormat);
gradTex.minFilter = gradTex.magFilter = THREE.LinearFilter;
gradTex.needsUpdate = true;

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(7000, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uGrad: { value: gradTex }, uF: { value: F_REF },
      uMin: { value: GRAD_MIN }, uMax: { value: GRAD_MAX }, uGround: { value: rgb(GROUND) },
      uTintX: { value: TINT.map(t => t.x) },
      uTintD: { value: TINT.map(t => new THREE.Vector3(...t.d.map(v => v / 255))) },
    },
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform sampler2D uGrad; uniform float uF, uMin, uMax; uniform vec3 uGround;
      vec3 srgb2lin(vec3 c){ return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }
      uniform float uTintX[7]; uniform vec3 uTintD[7];
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float h = uF * d.y / max(length(d.xz), 1e-4);                 // px above horizon at ref scale
        if (h < 0.0) { gl_FragColor = vec4(uGround, 1.0); return; }
        vec3 col = texture2D(uGrad, vec2(clamp((h - uMin) / (uMax - uMin), 0.0, 1.0), 0.5)).rgb;
        float az = atan(d.x, -d.z);                                   // full circle, no clamping
        float aR = atan(540.0 / uF);                                  // half the width of the reference frame, as an angle
        vec3 tint;
        if (abs(az) <= aR) {                                          // inside the sampled span: the measured tint, left → right
          float x = 540.0 + uF * tan(az);
          tint = uTintD[0];
          for (int i = 0; i < 6; i++) {
            float t = clamp((x - uTintX[i]) / (uTintX[i+1] - uTintX[i]), 0.0, 1.0);
            if (x > uTintX[i]) tint = mix(uTintD[i], uTintD[i+1], t);
          }
        } else {                                                      // everywhere else: ease from the right-hand tint round the back to the left-hand one
          float span = 6.2831853 - 2.0 * aR;
          float tt = (az > 0.0 ? az - aR : az + 6.2831853 - aR) / span;
          tint = mix(uTintD[6], uTintD[0], tt * tt * (3.0 - 2.0 * tt));
        }
        col += tint * smoothstep(0.0, 160.0, h);
        gl_FragColor = vec4(srgb2lin(col), 1.0);
      }`,
  })
);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

/* ------------------------------------------------------------------ *
 *  Ground (undulating, faintly mottled) — alpha 0 so grain skips it
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(9000, 9000, 600, 600).rotateX(-Math.PI / 2),
  new THREE.ShaderMaterial({
    uniforms: { uBase: { value: rgb(GROUND) } },
    vertexShader: `${TERRAIN_GLSL} varying vec2 vP; varying float vDist;
      void main(){ vec3 p = position; p.y = terrain(p.xz); vP = p.xz; vec4 mv = modelViewMatrix * vec4(p, 1.0); vDist = length(mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 uBase; varying vec2 vP; varying float vDist;
      void main(){
        float n = 0.5 * sin(vP.x * 0.013) * sin(vP.y * 0.017 + 1.0) + 0.5 * sin(vP.x * 0.004 + vP.y * 0.006);
        float near = 1.0 - smoothstep(0.0, 400.0, length(vP));
        vec3 c = uBase + vec3(0.8, 0.8, 1.2) / 255.0 * 0.3 * (n * 0.6 + 0.3 * near);
        gl_FragColor = vec4(c, vDist / ${GRAIN_DIST.toFixed(1)});   // alpha carries distance for the grain pass
      }`,
  })
);
ground.frustumCulled = false;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Grass: near blades + far stubs that ragged the horizon
 * ------------------------------------------------------------------ */
const grassU = {
  uPhase: { value: 0 }, uWind: { value: new THREE.Vector2(1, 0) }, uSpeed: { value: 8 },
  uSway: { value: 1 }, uGust: { value: 0.35 }, uTime: { value: 0 },
  uBase: { value: rgb(GROUND) }, uTip: { value: rgb([22, 20, 30]) },
  uOrigin: { value: new THREE.Vector2(0, 0) },                      // where the player stands (walk mode)
};
const grassVS = `
  ${TERRAIN_GLSL}
  attribute vec4 aData; attribute vec2 aRand; attribute float aW;
  uniform float uPhase, uSpeed, uSway, uGust, uTime, uWrap, uGlue; uniform vec2 uWind, uOrigin, uK0;
  uniform vec3 uBase, uTip;
  varying vec3 vCol; varying float vFog, vDist;
  void main(){
    float h = position.y, H = aData.w, yaw = aData.z;
    float W = aW * (1.0 - h * 0.92);
    vec2 side = vec2(cos(yaw), sin(yaw));
    vec2 xz = aData.xy;
    if (uWrap > 0.0) { vec2 rel = mod(xz - uOrigin + vec2(uWrap), vec2(2.0 * uWrap)) - vec2(uWrap); xz = uOrigin + rel; }   // walk-mode field: tiles around the player
    else if (uGlue > 0.5) xz += uOrigin;                                                                                  // walk-mode horizon stubs: travel with the player
    float along = dot(xz, uWind);
    float s01 = clamp(uSpeed / 12.0, 0.0, 2.0);
    float k = 0.22 / (1.0 + length(xz - uK0) / 40.0);                  // far stubs move in longer, coherent waves
    float ph = along * k - uPhase + aRand.x * 0.25;
    float wave = sin(ph) + 0.45 * sin(ph * 2.3 + 1.3 + xz.y * 0.07);
    float gust = 0.5 + 0.5 * sin(along * 0.05 - uTime * 0.35 + sin(xz.y * 0.03) * 2.0);
    float amp = (0.10 + 0.32 * s01) * (1.0 + uGust * (gust - 0.5) * 1.8);
    float lean = 0.12 + 0.55 * s01;
    float stiff = 1.0 / (1.0 + H * 0.35);                        // tall stubs flex less
    float bend = uSway * stiff * (lean + amp * wave);
    float flutter = uSway * stiff * 0.12 * (0.2 + s01) * sin(ph * 3.9 + aRand.x * 4.0 + uTime * 2.0);
    float ang = bend * h * 0.9;
    vec2 perp = vec2(-uWind.y, uWind.x);
    vec3 p = vec3(xz.x, terrain(xz) - 0.05, xz.y);
    p.xz += side * position.x * W;
    p.xz += uWind * sin(ang) * H * h;
    p.xz += perp * flutter * H * h * h * 0.25;
    p.y  += H * h * cos(ang);
    vec4 mv = viewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;
    vDist = length(mv.xyz);
    float d = -mv.z;
    vFog = smoothstep(18.0, 95.0, d);
    float shade = 0.65 + 0.35 * aRand.y;
    float sheen = 0.5 + 0.5 * wave;
    vCol = mix(uBase, uTip * shade * (0.75 + 0.45 * sheen), pow(h, 1.4));
  }`;
const grassFS = `
  uniform vec3 uBase; varying vec3 vCol; varying float vFog, vDist;
  void main(){ gl_FragColor = vec4(mix(vCol, uBase, vFog), vDist / ${GRAIN_DIST.toFixed(1)}); }`;
function makeGrass(N, fill, { wrap = 0, glue = 0, origin = false } = {}) {
  const SEG = 5, pos = [], idx = [];
  for (let i = 0; i <= SEG; i++) { const h = i / SEG; pos.push(-0.5, h, 0, 0.5, h, 0); }
  for (let i = 0; i < SEG; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  const data = new Float32Array(N * 4), rnd = new Float32Array(N * 2), wid = new Float32Array(N);
  for (let i = 0; i < N; i++) { fill(i, data, rnd, wid); }
  g.setAttribute('aData', new THREE.InstancedBufferAttribute(data, 4));
  g.setAttribute('aRand', new THREE.InstancedBufferAttribute(rnd, 2));

      const u = Math.min(1, Math.max(0, (d + 4) / 8)), sm = u * u * (3 - 2 * u);
      const half = (1.5 - 0.5 * sm) / 2;
      const ease = Math.min(1, Math.max(0, d) / 16);
      const cy = y + (Math.sin(px * 0.35 + time * 7 + sl.seed) * 0.35 + Math.sin(px * 0.13 - time * 4.3 + sl.seed * 2.0) * 0.25) * ease;
      top.push(px, cy - half); bot.push(px, cy + half);
    }
    const gr = g.createLinearGradient(0, 0, w, 0);
    const a = Math.min(1, Math.max(0, (x - 4) / w)), b = Math.min(1, Math.max(a, (x + 4) / w));
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(a, '#ffffff');
    gr.addColorStop(b, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0.35)');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(top[0], top[1]);
    for (let i = 2; i < top.length; i += 2) g.lineTo(top[i], top[i + 1]);
    for (let i = bot.length - 2; i >= 0; i -= 2) g.lineTo(bot[i], bot[i + 1]);
    g.closePath(); g.fill();
  }
}

const clock = new THREE.Clock();
let t = 0, phase = 0, gustSm = 0;
const wrapPI = a => Math.atan2(Math.sin(a), Math.cos(a));
const tmpV = new THREE.Vector3();

function renderFrame() {
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  if (V.bloom > 0) {
    brightMat.uniforms.tex.value = rt.texture; run(brightMat, mips[0].a);
    for (let i = 0; i < LEVELS; i++) {
      const m = mips[i], sz = m.a.width, szy = m.a.height;
      blurMat.uniforms.tex.value = m.a.texture; blurMat.uniforms.uD.value.set(1 / sz, 0); run(blurMat, m.b);
      blurMat.uniforms.tex.value = m.b.texture; blurMat.uniforms.uD.value.set(0, 1 / szy); run(blurMat, m.a);
      if (i < LEVELS - 1) { copyMat.uniforms.tex.value = m.a.texture; run(copyMat, mips[i + 1].a); }
    }
  }
  const u = finalMat.uniforms;
  u.tB0.value = mips[0].a.texture; u.tB1.value = mips[1].a.texture; u.tB2.value = mips[2].a.texture; u.tB3.value = mips[3].a.texture;
  u.uT.value = t; u.uAmt.value = V.grain * GRAIN_BASE; u.uWarp.value = V.grain * GRAIN_WARP; u.uBloom.value = V.bloom;
  run(finalMat, null);
}

function update(dt) {
  t += dt;
  smoothControls(dt);
  drawSliders(performance.now() / 1000);

  // wind: base speed + slow gusts
  const gustN = Math.sin(t * 0.37) * 0.6 + Math.sin(t * 0.91 + 1.7) * 0.3 + Math.sin(t * 2.3) * 0.1;
  gustSm += (gustN - gustSm) * Math.min(1, dt * 2);
  const v = Math.max(0, V.speed * (1 + 0.25 * V.gust * gustSm));
  phase += dt * (0.6 + v * 0.55);

  const toward = THREE.MathUtils.degToRad(V.dir + 180);            // direction the air moves
  grassU.uWind.value.set(Math.sin(toward), -Math.cos(toward)); grassU.uSpeed.value = v; grassU.uSway.value = V.sway;
  grassU.uGust.value = V.gust; grassU.uPhase.value = phase; grassU.uTime.value = t;

  // turbines: yaw into the wind, rotor speed follows wind via a cut-in / rated curve
  const targetYaw = Math.PI - THREE.MathUtils.degToRad(V.dir);
  const rated = THREE.MathUtils.clamp((v - 2.5) / 8.5, 0, 1);
  for (const T of turbines) {
    const wob = Math.sin(t * 0.13 + T.yawPhase) * 0.05 * (0.3 + V.gust);
    T.cur += wrapPI(targetYaw + T.yawOff + wob - T.cur) * Math.min(1, dt * 0.8);
    T.yaw.rotation.y = T.cur;
    const target = 1.7 * rated * T.rpmK;
    T.omega += (target - T.omega) * Math.min(1, dt * 0.6);        // rotor inertia
    T.rotor.rotation.z -= T.omega * dt;
  }
  // pylon wires + lights
  latticeU.uT.value = t; latticeU.uSpeed.value = v; latticeU.uWind.value.set(Math.sin(toward), -Math.cos(toward));
  updateBalls(t, v, latticeU.uWind.value);
  // beacons: flash envelope → glow sprites, emissive housing, and a real point light for the nearest few
  const key = ['farm', 'pylon', 'pylon2'][sceneIdx] || '';
  const P11 = 1 / TAN_HALF, pooled = [];                              // glows are sized by angle (as at the reference field of view), so they stay in proportion at any framing
  for (const b of beacons) {
    const fp = (t + b.off * S.interval) % S.interval;
    const env = S.hold ? 1 : fp < S.flashDur ? Math.sin(Math.PI * Math.pow(fp / S.flashDur, 0.6)) : 0;
    b.env = env;
    // constant screen size from far away (the reference look); physical size once you are close enough for it to matter
    b.obj.getWorldPosition(tmpV); const dist = Math.max(0.5, tmpV.distanceTo(camera.position));
    b.halo.scale.setScalar(Math.max(22 / REF_H * 2 / P11, 3.2 / dist));
    b.core.scale.setScalar(Math.max(9 / REF_H * 2 / P11, 1.3 / dist));
    b.halo.visible = b.core.visible = env > 0.01;
    b.halo.material.opacity = env;
    b.core.material.color.setRGB(5.0 * env, 0.8 * env, 0.6 * env);                 // HDR (linear): feeds the bloom
    b.housing.material.color.setRGB(0.1 + 6 * env, 0.008 + 0.9 * env, 0.008 + 0.7 * env);
    if (b.key === key) pooled.push(b);
  }
  if (pooled.length > POOL) {
    pooled.forEach(b => { b.obj.getWorldPosition(tmpV); b.dist = tmpV.distanceTo(camera.position); });
    pooled.sort((a, b) => a.dist - b.dist);
  }
  lightPool.forEach((l, n) => {
    const b = pooled[n];
    if (b && b.env > 0.01) { b.obj.getWorldPosition(l.position); l.intensity = BEACON_CD * b.env; } else l.intensity = 0;
  });
  // scene change: fade out, swap, fade in
  const target = pendingScene >= 0 ? 0 : 1;
  fade += (target - fade) * (1 - Math.exp(-dt / 0.11));
  if (pendingScene >= 0 && fade < 0.03) {
    SCENES[sceneIdx].show(false); sceneIdx = pendingScene; pendingScene = -1; SCENES[sceneIdx].show(true); paintScene();
  }
  finalMat.uniforms.uFade.value = fade;
  updateWalk(dt);
}
function frame() {
  update(Math.min(clock.getDelta(), 0.05));
  renderFrame();
  requestAnimationFrame(frame);
}
frame();

// Debug helper: render one frame and return mean/std of a region given in reference pixels
window.__sample = (x0, y0, x1, y1) => {
  const w = renderer.domElement.width, h = renderer.domElement.height, k = h / REF_H;
  renderFrame();
  const gl = renderer.getContext(), X0 = Math.floor(x0 * k), Y0 = Math.floor(y0 * k), W = Math.max(1, Math.floor((x1 - x0) * k)), Hh = Math.max(1, Math.floor((y1 - y0) * k));
  const buf = new Uint8Array(W * Hh * 4); gl.readPixels(X0, h - (Y0 + Hh), W, Hh, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  const m = [0,0,0], s = [0,0,0], n = W * Hh;
  for (let i = 0; i < n; i++) for (let c = 0; c < 3; c++) m[c] += buf[i*4+c];
  for (let c = 0; c < 3; c++) m[c] /= n;
  for (let i = 0; i < n; i++) for (let c = 0; c < 3; c++) s[c] += (buf[i*4+c] - m[c]) ** 2;
  return { mean: m.map(v => +v.toFixed(1)), std: s.map(v => +Math.sqrt(v / n).toFixed(1)), size: [w, h] };
};
// Debug: expose settings (__S.hold = true keeps the lights lit)
window.__go = i => { SCENES[sceneIdx].show(false); sceneIdx = (i + SCENES.length) % SCENES.length; pendingScene = -1; SCENES[sceneIdx].show(true); paintScene(); fade = 1; };
window.__fade = f => { fade = f; finalMat.uniforms.uFade.value = f; };
window.__cam = cam; window.__S = S; window.__V = V; window.__camera = camera; window.__walk = walk; window.__setWalk = setWalk;
</script>
